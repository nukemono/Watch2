<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Watch2 iPhone beta高度角版</title>
<style>
body{margin:0;background:#f6f7f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}.bad{background:#fff0f0;border-color:#e0aaaa}pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="status">Watch2 beta高度角版を読み込んでいます…</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    let html=await fetch('iphone-field.html',{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('iphone-field.html の取得に失敗: '+r.status);
      return r.text();
    });

    const replaceOnce=(from,to,label)=>{
      if(!html.includes(from)) throw new Error('パッチ対象が見つかりません: '+label);
      html=html.replace(from,to);
    };

    // 3D光軸高度は主値に使わず、現行Watchと同じ beta 基準高度を使用する。
    replaceOnce(
`  function betaElevation360(){
    if(!finite(state.b)) return null;
    return norm(state.b);
  }
`,
`  function betaElevation360(){
    if(!finite(state.b)) return null;
    return norm(state.b);
  }

  function normalElevationFromBeta(){
    if(!finite(state.b)) return null;
    // 非3D方式：DeviceOrientation beta を高度角の主値として使用。
    // 現行 Watch と同じ方式。3D光軸高度は診断値としてのみ残す。
    return Math.abs(state.b);
  }
`,
      'insert beta elevation function'
    );

    replaceOnce(
      'state.cameraElevation=state.camera3d && finite(state.camera3d.elevation) ? state.camera3d.elevation : null;',
      'state.cameraElevation=normalElevationFromBeta();',
      'primary elevation source'
    );

    replaceOnce('カメラ高度角 / 3D','高度角（beta基準 / 非3D）','elevation label');

    replaceOnce(
      'camera3d_elevation_deg:state.camera3d?.elevation??null,',
      'phone_elevation_deg:state.cameraElevation,\n      camera3d_optical_elevation_deg:state.camera3d?.elevation??null,',
      'sample elevation fields'
    );

    replaceOnce(
      'if(!finite(sample.ios_heading_corrected_deg)||!finite(sample.camera3d_elevation_deg))return {ok:false,hard:false,reason:\'方位または高度角を取得できません\'};',
      'if(!finite(sample.ios_heading_corrected_deg)||!finite(sample.phone_elevation_deg))return {ok:false,hard:false,reason:\'方位または高度角を取得できません\'};',
      'sample quality elevation field'
    );

    replaceOnce(
      'const elevations=state.samples.map(s=>s.camera3d_elevation_deg).filter(finite);',
      'const elevations=state.samples.map(s=>s.phone_elevation_deg).filter(finite);',
      'finish record elevation field'
    );

    html=html.replace(
      '<h1 style="margin-top:12px">☀️ iPhone 屋外統合検証 v2</h1>',
      '<h1 style="margin-top:12px">☀️ Watch2 iPhone beta高度角版</h1>'
    );
    html=html.replace(
      '測定前の安定待ちと測定中の品質監視',
      'beta基準の非3D高度角と、測定前の安定待ち・測定中の品質監視'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    status.className='card bad';
    status.innerHTML='<strong>読み込みエラー</strong><pre>'+String(e&&e.stack||e)+'</pre>';
  }
})();
</script>
</body>
</html>
