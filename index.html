<div class="card"><h1>☀️ Watch2</h1><p>カメラ高度角は3D光軸ではなく、DeviceOrientation beta を基準にした<strong>2D方式</strong>を主値にします。</p><div class="note"><strong>2D角度定義:</strong> 水平 = 0°。液晶面を手前側へ持ち上げるほど 180° に近づき、そのまま一周を 0〜360° で扱います。</div></div>
<div class="card"><p><span class="tag">iPhone</span><span class="tag">2D elevation</span><span class="tag">0–360°</span><span class="tag">10秒 / 50ms</span><span class="tag">CSV</span></p><a class="btn" href="iphone-field-beta.html">2D高度角版で測定する</a><a class="btn secondary" href="iphone-field.html">元CONTROL（3D光軸高度）を開く</a><a class="btn secondary" href="iphone-field-flex.html">手持ち対応版を開く</a></div>
<div class="card"><p>2D版は高度角の入力源だけを変更し、方位・GPS・時刻推定のロジックは元CONTROLを維持します。</p></div>
