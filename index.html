<div class="card"><h1>☀️ Watch2</h1><p>カメラ高度角は3D光軸ではなく、DeviceOrientation beta を基準にした非3D方式を主値にします。</p><div class="note"><strong>現在の既定:</strong> beta基準高度角。3D光軸高度は診断値としてのみ保持します。</div></div>
<div class="card"><p><span class="tag">iPhone</span><span class="tag">beta elevation</span><span class="tag">non-3D</span><span class="tag">10秒 / 50ms</span><span class="tag">CSV</span></p><a class="btn" href="iphone-field-beta.html">非3D高度角版で測定する</a><a class="btn secondary" href="iphone-field.html">元CONTROL（3D光軸高度）を開く</a><a class="btn secondary" href="iphone-field-flex.html">手持ち対応版を開く</a></div>
<div class="card"><p>非3D版は高度角の入力源だけを変更し、方位・GPS・時刻推定のロジックは元CONTROLを維持します。</p></div>
