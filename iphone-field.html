<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Watch2 — 高精度再現版</title>
<style>
body{margin:0;background:#f6f7f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}.bad{background:#fff0f0;border-color:#e0aaaa}pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="status">Watch2 高精度再現版を読み込んでいます…</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    // 高精度候補の基準コードを immutable commit から読み込む。
    // Watch2 では派生HTMLを作らず、この1ページに明示された差分だけを適用する。
    const BASE_URL='https://raw.githubusercontent.com/nukemono/Watch2/80ca9d9581fe6917d17a99316803db82cd429beb/iphone-field.html';
    let html=await fetch(BASE_URL,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('高精度基準コードの取得に失敗: '+r.status);
      return r.text();
    });

    const replaceOnce=(from,to,label)=>{
      if(!html.includes(from)) throw new Error('基準コードとの差分適用に失敗: '+label);
      html=html.replace(from,to);
    };

    // 1) 高度角は3D光軸を主値にせず、DeviceOrientation beta の2D角度を0〜360°で扱う。
    //    水平=0°、液晶面を手前へ持ち上げる方向に180°へ近づき、一周を360°で連続処理する。
    replaceOnce(
      'state.cameraElevation=state.camera3d && finite(state.camera3d.elevation) ? state.camera3d.elevation : null;',
      'state.cameraElevation=betaElevation360();',
      '2D elevation source'
    );
    replaceOnce('カメラ高度角 / 3D','カメラ高度角 / 2D','2D elevation label');
    replaceOnce(
      'camera3d_elevation_deg:state.camera3d?.elevation??null,',
      'camera2d_elevation_deg:state.cameraElevation,\n      camera3d_optical_elevation_deg:state.camera3d?.elevation??null,',
      '2D elevation sample field'
    );
    replaceOnce(
      "if(!finite(sample.ios_heading_corrected_deg)||!finite(sample.camera3d_elevation_deg))return {ok:false,hard:false,reason:'方位または高度角を取得できません'};",
      "if(!finite(sample.ios_heading_corrected_deg)||!finite(sample.camera2d_elevation_deg))return {ok:false,hard:false,reason:'方位または高度角を取得できません'};",
      '2D sample validation'
    );
    replaceOnce(
      'const elevations=state.samples.map(s=>s.camera3d_elevation_deg).filter(finite);',
      'const elevations=state.samples.map(s=>s.camera2d_elevation_deg).filter(finite);',
      '2D result elevation'
    );

    // 2) 手ブレ・安定性は診断値として残すが、測定開始条件にはしない。
    replaceOnce(
      'const usable=state.started && gpsOk && finite(state.primaryHeading) && finite(state.cameraElevation) && stab.held;',
      'const usable=state.started && gpsOk && finite(state.primaryHeading) && finite(state.cameraElevation);',
      'measurement start usability'
    );
    replaceOnce(
      "$('gateText').textContent=!state.location?'GPS待機中':!gpsOk?`GPS精度 ${state.location.accuracy.toFixed(0)}m：50m以下を待っています`:stab.held?'測定できます。太陽を中央に保って開始してください。':'安定性が1.5秒継続すると測定できます。';",
      "$('gateText').textContent=!state.location?'GPS待機中':!gpsOk?`GPS精度 ${state.location.accuracy.toFixed(0)}m：50m以下を待っています`:'測定できます。手ブレ・安定性は診断値として記録します。';",
      'measurement gate text'
    );
    replaceOnce(
`    const stab=updateStability();
    const gpsOk=state.location && finite(state.location.accuracy) && state.location.accuracy<=MAX_GPS_ACCURACY;
    if(!stab.held||!gpsOk){ alert('安定性が「測定可」かつGPS精度50m以下になってから開始してください。'); return; }`,
`    const stab=updateStability();
    const gpsOk=state.location && finite(state.location.accuracy) && state.location.accuracy<=MAX_GPS_ACCURACY;
    if(!gpsOk||!finite(state.primaryHeading)||!finite(state.cameraElevation)){ alert('GPS精度50m以下で、方位・2D高度角が取得できてから開始してください。'); return; }`,
      'record start gate'
    );

    // 3) 測定中の揺れで10秒測定を中断しない。SD・回転速度・readinessはCSVに残す。
    replaceOnce(
`      const q=sampleQuality(sample);
      if(q.hard){ state.recordAbortReason=q.reason; finishRecord(true); return; }
      if(!q.ok){
        if(state.recordUnstableSince===null)state.recordUnstableSince=performance.now();
        if(performance.now()-state.recordUnstableSince>=RECORD_UNSTABLE_GRACE_MS){ state.recordAbortReason=q.reason; finishRecord(true); return; }
      }else state.recordUnstableSince=null;`,
`      // 手持ち測定: 揺れ・回転・方位SDは診断値として保存し、10秒測定は継続する。`,
      'record instability abort'
    );

    // 4) 最終結果も安定性だけでは無効化しない。取得不能・GPS・サンプル不足は維持する。
    replaceOnce(
`    if(aborted)reasons.push(state.recordAbortReason||'測定中に端末が不安定になりました');
    if(state.samples.length<MIN_SAMPLE_COUNT)reasons.push(`+'`サンプル不足 ${state.samples.length}/${MIN_SAMPLE_COUNT}`'+`);
    if(!finite(hs.sd)||hs.sd>FINAL_HEADING_SD_MAX)reasons.push(`+'`方位SD ${finite(hs.sd)?hs.sd.toFixed(1):\'--\'}°`'+`);
    if(!finite(es.sd)||es.sd>FINAL_ELEV_SD_MAX)reasons.push(`+'`高度SD ${finite(es.sd)?es.sd.toFixed(1):\'--\'}°`'+`);
    if(readyRatio<MIN_READY_RATIO)reasons.push(`+'`安定サンプル率 ${(readyRatio*100).toFixed(0)}%`'+`);
    if(!loc||!finite(loc.accuracy)||loc.accuracy>MAX_GPS_ACCURACY)reasons.push(`+'`GPS精度 ${loc&&finite(loc.accuracy)?loc.accuracy.toFixed(0):\'--\'}m`'+`);`,
`    if(aborted)reasons.push(state.recordAbortReason||'測定を中断しました');
    if(state.samples.length<MIN_SAMPLE_COUNT)reasons.push(`+'`サンプル不足 ${state.samples.length}/${MIN_SAMPLE_COUNT}`'+`);
    if(!finite(hs.mean)||!finite(es.mean))reasons.push('方位または2D高度角の平均を算出できません');
    if(!loc||!finite(loc.accuracy)||loc.accuracy>MAX_GPS_ACCURACY)reasons.push(`+'`GPS精度 ${loc&&finite(loc.accuracy)?loc.accuracy.toFixed(0):\'--\'}m`'+`);`,
      'final validity gate'
    );

    // 表示だけWatch2に統一。推定器・方位補正・GPS・太陽位置計算は基準コードを維持する。
    html=html.replace('<title>太陽ウォッチ iPhone 屋外統合検証 v2</title>','<title>Watch2 — 高精度再現版</title>');
    html=html.replace('<h1 style="margin-top:12px">☀️ iPhone 屋外統合検証 v2</h1>','<h1 style="margin-top:12px">☀️ Watch2 — 高精度再現版</h1>');
    html=html.replace(
      '測定前の安定待ちと測定中の品質監視',
      '高精度候補コードを基準に、2D高度角0〜360°と手持ち測定を統合'
    );
    html=html.replace('安定性が1.5秒継続すると測定できます。','GPS・方位・2D高度角が取得できれば測定できます。');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    status.className='card bad';
    status.innerHTML='<strong>Watch2 読み込みエラー</strong><pre>'+String(e&&e.stack||e)+'</pre>';
  }
})();
</script>
</body>
</html>
