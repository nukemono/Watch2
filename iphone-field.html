<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Watch2 — 高精度再現版</title>
<style>
body{margin:0;background:#f6f7f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}.bad{background:#fff0f0;border-color:#e0aaaa}pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="status">Watch2 高精度再現版を読み込んでいます…</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    // 高精度候補の基準コードを immutable commit から読み込む。
    // Watch2 では派生HTMLを作らず、この1ページに明示された差分だけを適用する。
    const BASE_URL='https://raw.githubusercontent.com/nukemono/Watch2/80ca9d9581fe6917d17a99316803db82cd429beb/iphone-field.html';
    let html=await fetch(BASE_URL,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('高精度基準コードの取得に失敗: '+r.status);
      return r.text();
    });

    const replaceOnce=(from,to,label)=>{
      if(!html.includes(from)) throw new Error('基準コードとの差分適用に失敗: '+label);
      html=html.replace(from,to);
    };

    // WMM2025はWatch2リポジトリ内の係数を使い、基準コード本体より先に読み込む。
    replaceOnce(
      '\n<script>\n(() => {',
      '\n<script src="wmm.js"><\/script>\n<script>\n(() => {',
      'WMM loader'
    );

    // 1) 高度角は3D光軸を主値にせず、DeviceOrientation beta の2D角度を0〜360°で扱う。
    //    水平=0°、液晶面を手前へ持ち上げる方向に180°へ近づき、一周を360°で連続処理する。
    replaceOnce(
      'state.cameraElevation=state.camera3d && finite(state.camera3d.elevation) ? state.camera3d.elevation : null;',
      'state.cameraElevation=betaElevation360();',
      '2D elevation source'
    );
    replaceOnce('カメラ高度角 / 3D','カメラ高度角 / 2D','2D elevation label');
    replaceOnce(
      'camera3d_elevation_deg:state.camera3d?.elevation??null,',
      'camera2d_elevation_deg:state.cameraElevation,\n      camera3d_optical_elevation_deg:state.camera3d?.elevation??null,',
      '2D elevation sample field'
    );
    replaceOnce(
      "if(!finite(sample.ios_heading_corrected_deg)||!finite(sample.camera3d_elevation_deg))return {ok:false,hard:false,reason:'方位または高度角を取得できません'};",
      "if(!finite(sample.ios_heading_corrected_deg)||!finite(sample.camera2d_elevation_deg))return {ok:false,hard:false,reason:'方位または高度角を取得できません'};",
      '2D sample validation'
    );
    replaceOnce(
      'const elevations=state.samples.map(s=>s.camera3d_elevation_deg).filter(finite);',
      'const elevations=state.samples.map(s=>s.camera2d_elevation_deg).filter(finite);',
      '2D result elevation'
    );

    // 2) 手ブレ・安定性は診断値として残すが、測定開始条件にはしない。
    replaceOnce(
      'const usable=state.started && gpsOk && finite(state.primaryHeading) && finite(state.cameraElevation) && stab.held;',
      'const usable=state.started && gpsOk && finite(state.primaryHeading) && finite(state.cameraElevation);',
      'measurement start usability'
    );
    replaceOnce(
      "$('gateText').textContent=!state.location?'GPS待機中':!gpsOk?`GPS精度 ${state.location.accuracy.toFixed(0)}m：50m以下を待っています`:stab.held?'測定できます。太陽を中央に保って開始してください。':'安定性が1.5秒継続すると測定できます。';",
      "$('gateText').textContent=!state.location?'GPS待機中':!gpsOk?`GPS精度 ${state.location.accuracy.toFixed(0)}m：50m以下を待っています`:'測定できます。手ブレ・安定性は診断値として記録します。';",
      'measurement gate text'
    );
    replaceOnce(
`    const stab=updateStability();
    const gpsOk=state.location && finite(state.location.accuracy) && state.location.accuracy<=MAX_GPS_ACCURACY;
    if(!stab.held||!gpsOk){ alert('安定性が「測定可」かつGPS精度50m以下になってから開始してください。'); return; }`,
`    const stab=updateStability();
    const gpsOk=state.location && finite(state.location.accuracy) && state.location.accuracy<=MAX_GPS_ACCURACY;
    if(!gpsOk||!finite(state.primaryHeading)||!finite(state.cameraElevation)){ alert('GPS精度50m以下で、WMM補正後方位・2D高度角が取得できてから開始してください。'); return; }`,
      'record start gate'
    );

    // 3) 測定中の揺れで10秒測定を中断しない。SD・回転速度・readinessはCSVに残す。
    replaceOnce(
`      const q=sampleQuality(sample);
      if(q.hard){ state.recordAbortReason=q.reason; finishRecord(true); return; }
      if(!q.ok){
        if(state.recordUnstableSince===null)state.recordUnstableSince=performance.now();
        if(performance.now()-state.recordUnstableSince>=RECORD_UNSTABLE_GRACE_MS){ state.recordAbortReason=q.reason; finishRecord(true); return; }
      }else state.recordUnstableSince=null;`,
`      // 手持ち測定: 揺れ・回転・方位SDは診断値として保存し、10秒測定は継続する。`,
      'record instability abort'
    );

    // 4) 最終結果も安定性だけでは無効化しない。取得不能・GPS・サンプル不足は維持する。
    replaceOnce(
`    if(aborted)reasons.push(state.recordAbortReason||'測定中に端末が不安定になりました');
    if(state.samples.length<MIN_SAMPLE_COUNT)reasons.push(`+'`サンプル不足 ${state.samples.length}/${MIN_SAMPLE_COUNT}`'+`);
    if(!finite(hs.sd)||hs.sd>FINAL_HEADING_SD_MAX)reasons.push(`+'`方位SD ${finite(hs.sd)?hs.sd.toFixed(1):\'--\'}°`'+`);
    if(!finite(es.sd)||es.sd>FINAL_ELEV_SD_MAX)reasons.push(`+'`高度SD ${finite(es.sd)?es.sd.toFixed(1):\'--\'}°`'+`);
    if(readyRatio<MIN_READY_RATIO)reasons.push(`+'`安定サンプル率 ${(readyRatio*100).toFixed(0)}%`'+`);
    if(!loc||!finite(loc.accuracy)||loc.accuracy>MAX_GPS_ACCURACY)reasons.push(`+'`GPS精度 ${loc&&finite(loc.accuracy)?loc.accuracy.toFixed(0):\'--\'}m`'+`);`,
`    if(aborted)reasons.push(state.recordAbortReason||'測定を中断しました');
    if(state.samples.length<MIN_SAMPLE_COUNT)reasons.push(`+'`サンプル不足 ${state.samples.length}/${MIN_SAMPLE_COUNT}`'+`);
    if(!finite(hs.mean)||!finite(es.mean))reasons.push('方位または2D高度角の平均を算出できません');
    if(!loc||!finite(loc.accuracy)||loc.accuracy>MAX_GPS_ACCURACY)reasons.push(`+'`GPS精度 ${loc&&finite(loc.accuracy)?loc.accuracy.toFixed(0):\'--\'}m`'+`);`,
      'final validity gate'
    );

    // 5) WMM2025磁気偏角補正をデフォルト主方位へ適用する。
    //    iPhone既存補正後の値はCSVへ残し、表示・10秒平均・時刻推定はWMM補正後を使う。
    replaceOnce(
      '<div class="metric"><div class="label">主方位 / iPhone補正後</div><div id="heading" class="value big">--</div></div>',
      '<div class="metric"><div class="label">主方位 / WMM補正後（真北）</div><div id="heading" class="value big">--</div></div>',
      'WMM heading label'
    );
    replaceOnce(
      'camera3d:null, primaryHeading:null, cameraElevation:null,',
      "camera3d:null, baseHeading:null, primaryHeading:null, wmmDeclination:null, wmmModel:'', cameraElevation:null,",
      'WMM state fields'
    );
    replaceOnce(
`  function correctedIphoneHeading(){
    if(!finite(state.iosHeading)) return null;
    return norm(state.iosHeading + (state.flip.active ? 180 : 0) + screenDeg());
  }
`,
`  function correctedIphoneHeading(){
    if(!finite(state.iosHeading)) return null;
    return norm(state.iosHeading + (state.flip.active ? 180 : 0) + screenDeg());
  }

  function currentWmmResult(){
    if(!window.WMM2025||!WMM2025.loaded||!state.location) return null;
    const loc=state.location;
    if(!finite(loc.lat)||!finite(loc.lon)) return null;
    try{return WMM2025.calculate(loc.lat,loc.lon,finite(loc.altitude)?loc.altitude:0,new Date());}
    catch(e){return null;}
  }
`,
      'WMM calculation helper'
    );
    replaceOnce(
`    state.camera3d=cameraVectorFromOrientation(state.a,state.b,state.g);
    state.primaryHeading=correctedIphoneHeading();`,
`    state.camera3d=cameraVectorFromOrientation(state.a,state.b,state.g);
    state.baseHeading=correctedIphoneHeading();
    const wmm=currentWmmResult();
    state.wmmDeclination=wmm&&finite(wmm.declination)?wmm.declination:null;
    state.wmmModel=wmm?.model||'';
    state.primaryHeading=finite(state.baseHeading)&&finite(state.wmmDeclination)?norm(state.baseHeading+state.wmmDeclination):null;`,
      'WMM primary heading'
    );
    replaceOnce(
      "    $('sourceText').textContent='方位ソース: webkitCompassHeading + 180°ジャンプ/parity補正';",
      "    $('sourceText').textContent=finite(state.wmmDeclination)?`方位ソース: iPhone補正後 ${fmt(state.baseHeading)} + WMM偏角 ${(state.wmmDeclination>=0?'+':'')+state.wmmDeclination.toFixed(2)}° → 真方位 ${fmt(state.primaryHeading)}`:'方位ソース: WMM2025 / GPS位置・係数読込待ち';",
      'WMM source display'
    );
    replaceOnce(
      "$('gateText').textContent=!state.location?'GPS待機中':!gpsOk?`GPS精度 ${state.location.accuracy.toFixed(0)}m：50m以下を待っています`:'測定できます。手ブレ・安定性は診断値として記録します。';",
      "$('gateText').textContent=!state.location?'GPS待機中':!gpsOk?`GPS精度 ${state.location.accuracy.toFixed(0)}m：50m以下を待っています`:!finite(state.wmmDeclination)?'WMM2025偏角の計算待ち':'測定できます。WMM補正後方位を使用し、手ブレ・安定性は診断値として記録します。';",
      'WMM gate display'
    );
    replaceOnce(
      '      ios_heading_corrected_deg:state.primaryHeading,',
`      ios_heading_corrected_before_wmm_deg:state.baseHeading,
      wmm_declination_deg:state.wmmDeclination,
      wmm_model:state.wmmModel,
      ios_heading_corrected_deg:state.primaryHeading,`,
      'WMM sample fields'
    );

    // 測定者が見る数値は方位・高度だけに絞る。
    // hidden にするだけなので内部取得・CSV記録・検証用処理はそのまま残す。
    for(const [from,to,label] of [
      ['<div class="metric"><div class="label">raw webkitCompass</div><div id="rawHeading" class="value">--</div></div>','<div class="metric hidden"><div class="label">raw webkitCompass</div><div id="rawHeading" class="value">--</div></div>','hide raw heading'],
      ['<div class="metric"><div class="label">Compass Accuracy</div><div id="compassAccuracy" class="value">--</div></div>','<div class="metric hidden"><div class="label">Compass Accuracy</div><div id="compassAccuracy" class="value">--</div></div>','hide compass accuracy'],
      ['<div class="metric"><div class="label">beta姿勢角 0–360</div><div id="beta360" class="value">--</div></div>','<div class="metric hidden"><div class="label">beta姿勢角 0–360</div><div id="beta360" class="value">--</div></div>','hide beta'],
      ['<div class="metric"><div class="label">3Dカメラ方位 診断</div><div id="camera3dHeading" class="value">--</div></div>','<div class="metric hidden"><div class="label">3Dカメラ方位 診断</div><div id="camera3dHeading" class="value">--</div></div>','hide 3d heading'],
      ['<div class="metric"><div class="label">GPS精度</div><div id="gpsAccuracy" class="value">--</div></div>','<div class="metric hidden"><div class="label">GPS精度</div><div id="gpsAccuracy" class="value">--</div></div>','hide gps accuracy'],
      ['<div class="metric"><div class="label">回転速度 最大軸</div><div id="rotationRate" class="value">--</div></div>','<div class="metric hidden"><div class="label">回転速度 最大軸</div><div id="rotationRate" class="value">--</div></div>','hide rotation'],
      ['<div class="muted mono" id="sourceText">方位ソース: --</div>','<div class="muted mono hidden" id="sourceText">方位ソース: --</div>','hide source'],
      ['<div id="flipText" class="muted mono">180°補正: --</div>','<div id="flipText" class="muted mono hidden">180°補正: --</div>','hide flip']
    ]) replaceOnce(from,to,label);

    // 表示だけWatch2に統一。既存の2D高度角・手持ち測定ルールは維持する。
    html=html.replace('<title>太陽ウォッチ iPhone 屋外統合検証 v2</title>','<title>Watch2 — 高精度再現版</title>');
    html=html.replace('<h1 style="margin-top:12px">☀️ iPhone 屋外統合検証 v2</h1>','<h1 style="margin-top:12px">☀️ Watch2 — 高精度再現版</h1>');
    html=html.replace(
      '測定前の安定待ちと測定中の品質監視',
      '高精度候補コードを基準に、2D高度角0〜360°・手持ち測定・WMM2025真北補正を統合'
    );
    html=html.replace('安定性が1.5秒継続すると測定できます。','GPS・WMM補正後方位・2D高度角が取得できれば測定できます。');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    status.className='card bad';
    status.innerHTML='<strong>Watch2 読み込みエラー</strong><pre>'+String(e&&e.stack||e)+'</pre>';
  }
})();
</script>
</body>
</html>
